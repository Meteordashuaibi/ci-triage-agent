[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "LLM agent that analyzes failed GitHub Actions runs and produces root cause hypotheses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Meteor" }]
dependencies = [
    "anthropic>=0.39.0",
    "gitpython>=3.1.50",
    "pydantic>=2.8.0",
    "pygithub",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
